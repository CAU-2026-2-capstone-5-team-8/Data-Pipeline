[project]
name = "cau-book-data-pipeline"
version = "0.1.0"
description = "Evidence-first book metadata collection and normalization pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pypdf>=6.0,<7",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0,<2",
    "selectolax>=0.3.33,<1",
    "tenacity>=9.1,<10",
    "typer>=0.16,<1",
]

[project.scripts]
data-pipeline = "data_pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "data_pipeline/configs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
